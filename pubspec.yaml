name: simple_video_converter
description: "Simple Video Converter mit FFmpegKit (libx264/libx265)"
publish_to: 'none'

version: 2.2.1+32

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffmpeg_kit_flutter_new: ^4.5.1    # Community-Fork: FFmpeg 8 mit libx264/libx265
  file_picker: ^11.0.2               # Speichern-Dialog
  image_picker: ^1.2.3               # Video-Auswahl (nativer Media-Picker mit Thumbnails)
  video_player: ^2.13.0             # Video-Preview
  path_provider: ^2.1.6              # Cache-Verzeichnis für Output-Datei
  open_filex: ^4.7.0                 # Gespeicherte Datei im Systemvideoplayer öffnen
  permission_handler: ^12.0.3        # Runtime-Permissions (Notifications)
  intl: ^0.20.2                      # Dart i18n (wird von flutter_localizations benötigt)
  shared_preferences: ^2.5.5         # Persistente Einstellungen (analog zu Android SharedPreferences)
  url_launcher: ^6.3.1               # URLs im Browser öffnen (GPL-Link, GitHub-Link)
  firebase_core: ^4.12.1              # Firebase Grundpaket (Pflicht für alle Firebase-Dienste)
  firebase_analytics: ^12.3.0       # Google Analytics für Firebase
  firebase_crashlytics: ^5.2.0      # Crash-Reporting
  google_mobile_ads: ^9.2.0         # Offizielles Flutter-Plugin; Android nutzt per Dart-Define das Next-Gen SDK
  in_app_purchase: 3.3.0             # Einmaliger Kauf „Werbung entfernen" – 3.3.0 nutzt Billing 8.0.0 (in_app_purchase_android 0.5.0), erfüllt Play-Pflicht ≥ 7.0.0
  in_app_review: ^2.0.12             # Google Play In-App-Review-Dialog
  gal: ^2.3.2                        # Video in Galerie speichern ohne RAM-Laden
  disk_space_plus: ^0.2.6          # Freier interner Speicherplatz in MB
  package_info_plus: ^9.0.1        # Neueste stabile Version, die mit file_picker 11 auflösbar ist

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1   # Icon-Generierung

dependency_overrides:
  # Gepatchte Kopie von video_player_android 2.12.0: der platformView-Pfad
  # dereferenziert stromaufwärts exoPlayer.getVideoFormat() ohne Null-Prüfung und
  # reißt den Prozess mit einer NPE ab, wenn ExoPlayer READY meldet, bevor ein
  # Video-Format da ist. Details und Rück-Portierung: third_party/video_player_android/PATCHES.md
  video_player_android:
    path: third_party/video_player_android

flutter:
  uses-material-design: true
  generate: true          # Aktiviert flutter gen-l10n für ARB → Dart

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
