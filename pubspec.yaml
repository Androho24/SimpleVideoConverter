name: simple_video_converter
description: "Simple Video Converter mit FFmpegKit (libx264)"
publish_to: 'none'

version: 1.1.1+23

environment:
  sdk: ^3.10.0   # angehoben für google_mobile_ads 8.x (verlangt Dart >= 3.10.0)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffmpeg_kit_flutter_new: ^4.1.0    # Community-Fork: libx264 via Maven Central (com.antonkarpenko)
  file_picker: ^10.1.2               # Speichern-Dialog
  image_picker: ^1.1.2               # Video-Auswahl (nativer Media-Picker mit Thumbnails)
  video_player: ^2.10.0             # Video-Preview
  path_provider: ^2.1.5              # Cache-Verzeichnis für Output-Datei
  share_plus: ^10.1.2                # Output-Datei teilen/speichern
  open_filex: ^4.7.0                 # Gespeicherte Datei im Systemvideoplayer öffnen
  permission_handler: ^11.3.1        # Runtime-Permissions (Notifications)
  intl: ^0.20.2                      # Dart i18n (wird von flutter_localizations benötigt)
  shared_preferences: ^2.3.4         # Persistente Einstellungen (analog zu Android SharedPreferences)
  url_launcher: ^6.3.1               # URLs im Browser öffnen (GPL-Link, GitHub-Link)
  firebase_core: ^4.7.0              # Firebase Grundpaket (Pflicht für alle Firebase-Dienste)
  firebase_analytics: ^12.3.0       # Google Analytics für Firebase
  firebase_crashlytics: ^5.2.0      # Crash-Reporting
  google_mobile_ads: ^8.0.0          # AdMob Native Ads (8.x nötig für Mediation-Adapter unten)
  gma_mediation_pangle: ^3.6.0       # AdMob-Mediation: Pangle (Bidding) – Maven-Repo in android/build.gradle.kts
  gma_mediation_meta: ^1.5.2         # AdMob-Mediation: Meta Audience Network (Bidding)
  in_app_purchase: 3.3.0             # Einmaliger Kauf „Werbung entfernen" – 3.3.0 nutzt Billing 8.0.0 (in_app_purchase_android 0.5.0), erfüllt Play-Pflicht ≥ 7.0.0
  in_app_review: ^2.0.9              # Google Play In-App-Review-Dialog
  gal: ^1.3.1                        # Video in Galerie speichern ohne RAM-Laden
  disk_space_plus: ^0.2.6          # Freier interner Speicherplatz in MB
  package_info_plus: ^4.2.0        # App-Version aus pubspec zur Laufzeit lesen

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1   # Icon-Generierung

flutter:
  uses-material-design: true
  generate: true          # Aktiviert flutter gen-l10n für ARB → Dart

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
